databases:
  - name: pedidos-db
    plan: free
    databaseName: pedidos
    user: pedidos

services:
  - type: web
    name: pedidos-api
    runtime: node
    plan: free
    rootDir: pedidos-lancamento-app/server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/index.js
    envVars:
      # `pedidos-db` (declarado acima) foi suspenso pelo Render por expiração do
      # plano free e foi substituído por um banco novo criado direto no painel,
      # fora deste blueprint. Como variável gerenciada por `fromDatabase`, o
      # Render reescrevia o valor de volta pra essa referência a cada deploy,
      # sobrescrevendo a URL nova — por isso virou `sync: false` (só o painel
      # manda no valor, o blueprint não mexe mais nela).
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_OWNER_EMAIL
        sync: false
      - key: SEED_OWNER_PASSWORD
        sync: false
      - key: SEED_OWNER_NAME
        value: Dono
      - key: GOOGLE_MAPS_API_KEY
        sync: false
