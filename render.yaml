databases:
  - name: pedidos-db
    plan: free
    databaseName: pedidos
    user: pedidos

services:
  - type: web
    name: pedidos-api
    runtime: node
    plan: free
    rootDir: pedidos-lancamento-app/server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pedidos-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_OWNER_EMAIL
        sync: false
      - key: SEED_OWNER_PASSWORD
        sync: false
      - key: SEED_OWNER_NAME
        value: Dono
